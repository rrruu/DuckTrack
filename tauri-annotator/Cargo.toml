[package]
name = "ducktrack-annotator"
version = "0.1.0"
description = "DuckTrack annotator (Tauri + Vue3)"
authors = ["DuckTrack"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rfd = "0.15"
once_cell = "1.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1.0"

